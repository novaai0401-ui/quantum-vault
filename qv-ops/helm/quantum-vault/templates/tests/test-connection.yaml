apiVersion: v1
kind: Pod
metadata:
  name: {{ include "qv.fullname" . }}-test-connection
  labels: {{- include "qv.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthcheck
      image: busybox:1.36
      command: ['wget']
      args: ['-q', '-O-', 'http://{{ include "qv.fullname" . }}:{{ .Values.service.port }}/v3/health']
