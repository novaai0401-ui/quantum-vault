{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qv.serviceAccountName" . }}
  labels: {{- include "qv.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# qv-server never talks to the Kubernetes API; a dedicated ServiceAccount
# with automount disabled removes the default token from the pod.
automountServiceAccountToken: false
{{- end }}
