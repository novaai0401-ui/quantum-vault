{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qv.fullname" . }}
  labels: {{- include "qv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "qv.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 7433
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS only by default — qv-server makes no outbound calls unless the
    # OTLP exporter or Postgres ChainStore is enabled; open those with
    # networkPolicy.extraEgress.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
