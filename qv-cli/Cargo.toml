[package]
name = "qv-cli"
version = "3.0.0"
edition = "2021"
description = "Sigvault command-line interface"
license     = "Apache-2.0 OR AGPL-3.0-only"

[[bin]]
name = "qv"
path = "src/main.rs"

[features]
# Default builds with Falcon. Operators on platforms without a C
# toolchain (e.g. wasm32-unknown-unknown — but the CLI doesn't target
# that) can opt out with --no-default-features.
default = ["falcon"]
falcon  = ["qv-core/falcon"]

[dependencies]
qv-core    = { path = "../qv-core", default-features = false }
clap       = { version = "4", features = ["derive"] }
serde_json = "1"
hex        = "0.4"
anyhow     = "1"
rand       = { version = "0.8", features = ["getrandom"] }
