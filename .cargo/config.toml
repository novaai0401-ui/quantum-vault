# v4.1: unblock wasm32-unknown-unknown by telling getrandom 0.3/0.4 to use
# the `custom` backend (qv-wasm provides `__getrandom_v03_custom`).
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="custom"']

# ── v4.2 Sovereignty: use vendored crate sources from ./vendor ──────────────
# Re-enabled after `cargo vendor vendor` pulled pqcrypto-falcon and all its
# transitive deps in-tree. Builds are now offline / air-gap clean.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
