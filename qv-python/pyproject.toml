[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name            = "sigvault"
version         = "4.3.4"
description     = "Post-quantum (ML-DSA-87 / Falcon) cryptographic tokens — Python client for the Sigvault REST server."
readme          = "README.md"
license         = { text = "Apache-2.0" }
requires-python = ">=3.8"
authors         = [{ name = "Sigvault contributors" }]
keywords        = ["post-quantum", "pqc", "ml-dsa", "dilithium", "falcon", "jwt", "tokens", "crypto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = []  # stdlib-only — no runtime deps, no wheels to rot

[project.urls]
Homepage      = "https://github.com/007krcs/quantum-vault"
Repository    = "https://github.com/007krcs/quantum-vault"
Issues        = "https://github.com/007krcs/quantum-vault/issues"
Documentation = "https://github.com/007krcs/quantum-vault#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/sigvault"]

[tool.hatch.build.targets.sdist]
include = ["src/sigvault", "README.md", "LICENSE"]
