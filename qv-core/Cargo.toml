[package]
name        = "qv-core"
version     = "4.3.1"
edition     = "2021"
rust-version = "1.75"
description = "Sigvault — post-quantum cryptographic tokens (ML-DSA-87 + Falcon-512/1024, XChaCha20-Poly1305, SHA3-256, mutation-chain replay protection)."
authors     = ["Sigvault contributors"]
license     = "Apache-2.0"
repository  = "https://github.com/007krcs/quantum-vault"
homepage    = "https://github.com/007krcs/quantum-vault"
documentation = "https://docs.rs/qv-core"
readme      = "README.md"
keywords    = ["cryptography", "post-quantum", "ml-dsa", "falcon", "tokens"]
categories  = ["cryptography", "authentication", "no-std"]
include     = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
ml-dsa = { version = "0.1.0-rc.8", features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "0.3.0-rc.2", features = ["getrandom", "zeroize"] }
chacha20poly1305 = "0.10"
sha3 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

# Falcon signatures via PQClean (pure C, wrapped in pqcrypto-falcon).
# Feature-gated so targets without a C toolchain (e.g. wasm32-unknown-unknown)
# can still build ML-DSA-only. Enable with `--features falcon`.
pqcrypto-falcon = { version = "0.4", default-features = false, features = ["std"], optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[features]
default = ["falcon"]
falcon  = ["dep:pqcrypto-falcon", "dep:pqcrypto-traits"]

[dev-dependencies]
hex = "0.4"
