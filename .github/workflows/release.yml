# Sigvault release pipeline
# =============================
# Triggers on pushing a tag like `v4.2.0`. Fans out to:
#   1. npm         → @sigvault/sdk          (qv-sdk/)
#   2. npm         → @sigvault/wasm          (qv-wasm/pkg/ + built .wasm)
#   3. crates.io   → qv-core                     (qv-core/)
#   3b. PyPI       → sigvault                 (qv-python/)
#   4. GitHub Releases — prebuilt FFI binaries for 5 platforms:
#        linux x86_64 / linux aarch64 / macOS x86_64 / macOS arm64 / windows x86_64
#   5. GHCR        → ghcr.io/<owner>/qv-server   (qv-server/Dockerfile)
#
# Required repository secrets (already set by the maintainer):
#   NPM_TOKEN             — npm automation token with publish access to @sigvault
#   CARGO_REGISTRY_TOKEN  — crates.io token with publish-new + publish-update
#   PYPI_API_TOKEN        — PyPI token with publish access to `sigvault`
#   GITHUB_TOKEN          — auto-provided, used for GHCR + Releases

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but skip publish steps'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents:     write    # create GitHub Releases + upload assets
  packages:     write    # push to GHCR
  id-token:     write    # cosign keyless OIDC + npm publish --provenance
  attestations: write    # SBOM / provenance attestations

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 0. Sanity — run qv-core tests on Linux before publishing anywhere.
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: test qv-core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -p qv-core --features falcon

  # ────────────────────────────────────────────────────────────────────────
  # 1. Publish @sigvault/sdk to npm
  # ────────────────────────────────────────────────────────────────────────
  npm-sdk:
    name: npm — @sigvault/sdk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version matches tag
        if: github.event_name == 'push'
        working-directory: qv-sdk
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::qv-sdk/package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        working-directory: qv-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────
  # 2. Build qv-wasm → publish @sigvault/wasm to npm
  # ────────────────────────────────────────────────────────────────────────
  npm-wasm:
    name: npm — @sigvault/wasm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build wasm (ML-DSA-only, no falcon)
        env:
          # Job-level env sets RUSTFLAGS=-D warnings, which overrides the
          # `[target.wasm32-unknown-unknown] rustflags = ...` entry in
          # .cargo/config.toml. We need the `getrandom_backend="custom"`
          # cfg here so getrandom 0.3/0.4 pick up qv-wasm's
          # `__getrandom_v03_custom` shim instead of erroring out.
          RUSTFLAGS: '-D warnings --cfg getrandom_backend="custom"'
        run: |
          cargo build -p qv-wasm --release --target wasm32-unknown-unknown

      - name: Stage publish directory
        run: |
          cp target/wasm32-unknown-unknown/release/qv_wasm.wasm qv-wasm/pkg/
          cp LICENSE qv-wasm/pkg/LICENSE
          ls -lh qv-wasm/pkg/

      - name: Verify version matches tag
        if: github.event_name == 'push'
        working-directory: qv-wasm/pkg
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::qv-wasm/pkg/package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        working-directory: qv-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────
  # 3. Publish qv-core to crates.io
  # ────────────────────────────────────────────────────────────────────────
  crates-io:
    name: crates.io — qv-core
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo publish` refuses to talk to a registry that's been replaced
      # with a local vendored source. Neutralize the repo-local config for
      # this job only.
      - name: Disable vendored-sources for publish
        run: rm -f .cargo/config.toml

      - name: Dry-run package
        working-directory: qv-core
        run: cargo package --no-verify

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        working-directory: qv-core
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify

  # ────────────────────────────────────────────────────────────────────────
  # 3b. Publish sigvault (Python REST client) to PyPI
  # ────────────────────────────────────────────────────────────────────────
  pypi:
    name: pypi — sigvault
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify version matches tag
        if: github.event_name == 'push'
        working-directory: qv-python
        run: |
          PKG_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::qv-python/pyproject.toml version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build sdist + wheel
        working-directory: qv-python
        run: python -m build

      - name: Check distributions
        working-directory: qv-python
        run: twine check dist/*

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        working-directory: qv-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  # ────────────────────────────────────────────────────────────────────────
  # 4. Prebuilt FFI binaries for 5 platforms → GitHub Release
  # ────────────────────────────────────────────────────────────────────────
  ffi-binaries:
    name: ffi — ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: dylib
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: dylib
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: dll
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 linker (aarch64-linux only)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build qv-ffi (release)
        run: cargo build -p qv-ffi --release --target ${{ matrix.target }} --features falcon

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.ext }}" in
            so|dylib) cp "target/${{ matrix.target }}/release/libqv.${{ matrix.ext }}" out/ ;;
            dll)      cp "target/${{ matrix.target }}/release/qv.dll"                   out/ ;;
          esac
          cp qv-ffi/include/qv.h out/
          cp LICENSE out/LICENSE
          cp README.md out/README.md

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf "libqv-${{ matrix.target }}.tar.gz" -C out .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath "libqv-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqv-${{ matrix.target }}
          path: libqv-${{ matrix.target }}.*
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # 5. Create GitHub Release and attach all artifacts.
  # ────────────────────────────────────────────────────────────────────────
  github-release:
    name: github — release ${{ github.ref_name }}
    needs: ffi-binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download all ffi artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libqv-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Sigvault ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/libqv-*.tar.gz
            dist/libqv-*.zip
          body: |
            Sigvault **${{ github.ref_name }}** — post-quantum cryptographic tokens
            (ML-DSA-87, Falcon-512/1024) distributed through five channels.

            ### Install

            ```bash
            # JavaScript / TypeScript
            npm install @sigvault/sdk

            # Browsers / Workers / Deno
            npm install @sigvault/wasm

            # Rust
            cargo add qv-core --features falcon

            # Server (Docker)
            docker pull ghcr.io/${{ github.repository_owner }}/qv-server:${{ github.ref_name }}
            ```

            ### Native FFI (C / Go / C# / Swift / Java)

            Download the tarball / zip for your platform below. Each archive
            contains `libqv.{so,dylib}` or `qv.dll`, the `qv.h` header,
            `LICENSE`, and `README.md`.

  # ────────────────────────────────────────────────────────────────────────
  # 6. Build & push qv-server to GHCR.
  # ────────────────────────────────────────────────────────────────────────
  docker-ghcr:
    name: ghcr — qv-server
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qv-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: qv-server
          file: qv-server/Dockerfile
          push: true
          # linux/arm64 cross-build under buildkit's QEMU emulator on
          # amd64 hosts has been hitting exit 255 on basic `mkdir` /
          # `chown` / `adduser` invocations regardless of the actual
          # command — see runs 25272284198 / 25273594937 / 25275720759.
          # Single-arch amd64 sidesteps QEMU entirely. ARM users build
          # locally with `docker buildx --platform linux/arm64`. We'll
          # restore multi-arch when buildkit/QEMU stabilises.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true                # SLSA provenance attestation
          sbom: true                      # Inline SBOM via BuildKit

      # ── Sign the published image with Sigstore cosign (keyless / OIDC) ──
      # Why keyless: no static key to leak. The signature is bound to the
      # GitHub Actions OIDC identity (`repo:org/quantum-vault:ref:refs/...`)
      # and verifiable by anyone with `cosign verify --certificate-identity-regexp`.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            cosign sign --yes "${tag}@${{ steps.build.outputs.digest }}"
          done

      # ── Attach the SBOM as an OCI artefact ──
      - name: Generate SBOM (CycloneDX)
        run: node qv-ops/scripts/sbom.mjs > /tmp/sbom.cdx.json

      - name: Attach SBOM
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            cosign attest --yes \
              --predicate /tmp/sbom.cdx.json \
              --type cyclonedx \
              "${tag}@${{ steps.build.outputs.digest }}"
          done
